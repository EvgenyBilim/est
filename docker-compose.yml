services:
    http:
        build: .
        env_file:
            - local.env
        ports:
            - "8000:8000"
        depends_on:
            - postgres
    postgres:
        image: postgres:17
        restart: always
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=estate
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
